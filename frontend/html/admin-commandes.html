<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OPEN Business World — Commandes & Messages</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32x32.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
</head>

<body style="background:#f5f5f5;">

  <header style="background:#fff; padding:16px 24px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; flex-wrap:wrap; gap:12px;">
    <div style="display:flex; align-items:center; gap:12px;">
      <img src="../images/logo.webp" alt="OPEN Business World" style="height:36px;" />
      <span style="font-weight:600;">Administration</span>
    </div>
    <nav style="display:flex; gap:16px;">
      <a href="admin-dashboard.html" style="text-decoration:none; color:#666; font-size:14px;">Produits</a>
      <a href="admin-commandes.html" style="text-decoration:none; color:var(--color-primary); font-weight:600; font-size:14px;">Commandes & Messages</a>
    </nav>
    <div style="display:flex; align-items:center; gap:16px;">
      <span id="adminNomAffiche" style="color:#666; font-size:14px;"></span>
      <button id="btnDeconnexion" class="qty-btn" style="padding:8px 16px;">
        <i class="ti ti-logout" aria-hidden="true"></i> Déconnexion
      </button>
    </div>
  </header>

  <main style="max-width:1100px; margin:24px auto; padding:0 24px;">

    <h1 style="font-size:22px; margin-bottom:20px;">Commandes récentes</h1>

    <div id="listeCommandes" style="display:flex; flex-direction:column; gap:12px; margin-bottom:40px;"></div>

    <h1 style="font-size:22px; margin-bottom:20px;">Messages de contact</h1>

    <div id="listeMessages" style="display:flex; flex-direction:column; gap:12px;"></div>

  </main>

  <script src="../js/main.js"></script>

</body>
</html>
