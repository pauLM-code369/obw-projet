<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OPEN Business World — Connexion Admin</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32x32.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
</head>

<body style="background:#f5f5f5; min-height:100vh; display:flex; align-items:center; justify-content:center;">

  <div style="background:#fff; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.08); padding:40px; width:100%; max-width:400px;">

    <div style="text-align:center; margin-bottom:24px;">
      <img src="../images/logo.webp" alt="OPEN Business World" style="height:48px;" />
      <h1 style="font-size: 23px; text-align: center; transform: translateX(-8%); font-family: 'Arial', sans-serif; font-style: italic; font-weight: bold; margin-top: 16px;">Administrateur OBW</h1>


    </div>

    <form id="formLogin">
      <div class="form-group">
        <label for="admin-email">Email</label>
        <input type="email" id="admin-email" placeholder="votre@email.com" required />
      </div>

      <div class="form-group">
        <label for="admin-password">Mot de passe</label>
        <input type="password" id="admin-password" placeholder="••••••••" required />
      </div>

      <div id="loginError" style="display:none; color:#EF4444; font-size:13px; margin-bottom:12px;"></div>

      <button type="submit" class="contact-submit-btn" style="width:100%;">
        <i class="ti ti-login" aria-hidden="true"></i> Se connecter
      </button>
    </form>

  </div>

  <script src="../js/main.js"></script>

</body>
</html>
